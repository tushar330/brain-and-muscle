syntax = "proto3";

package ml_topology;

service ParameterServer {
    rpc PullWeights(PullRequest) returns (stream TensorChunk) {}
    rpc PushGradients(stream TensorChunk) returns (PushAck) {}
}

message PullRequest {
    string worker_id = 1;
    int64 request_epoch = 2;
}

message TensorChunk {
  string worker_id = 1;
  uint64 current_epoch = 2;
  uint32 chunk_index = 3; 
  uint32 total_chunks = 4; 
  bytes raw_tensor_data = 5; 
}

message PushAck {
  bool success = 1;
  uint64 acknowledged_epoch = 2;
}